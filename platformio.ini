; ─────────────────────────────────────────────────────────────────────────────
; PlatformIO project configuration for Tramli on T-Display S3 Pro
; ─────────────────────────────────────────────────────────────────────────────
; This file tells PlatformIO:
;   - what board we're using (ESP32-S3 with 16MB flash + 8MB PSRAM)
;   - which Arduino libraries to install automatically
;   - what compiler flags to set (display driver, fonts, USB CDC)
;
; You normally don't need to edit this. PlatformIO reads it when you click
; "Build" or "Upload" and downloads everything automatically.
; ─────────────────────────────────────────────────────────────────────────────

[env:lilygo-t-display-s3-pro]
platform      = espressif32 @ 6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino

; ── Board memory layout ──────────────────────────────────────────────────────
; T-Display S3 Pro uses ESP32-S3R8 with OPI PSRAM (not the default QSPI).
; The board definition esp32-s3-devkitc-1 assumes QSPI, so we override it.
board_build.flash_mode       = qio
board_build.psram_type       = opi
board_build.memory_type      = qio_opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash          = 80000000L
board_build.flash_size       = 16MB
board_build.partitions       = default_16MB.csv
board_upload.flash_size      = 16MB
board_upload.maximum_size    = 16777216

; ── Serial monitor for debugging ─────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; ── Libraries we depend on ───────────────────────────────────────────────────
; PlatformIO downloads these automatically the first time you build.
;
; We use Arduino_GFX (not TFT_eSPI) because LILYGO's T-Display S3 Pro has
; a 49-pixel column offset on its ST7796 panel that TFT_eSPI can't handle
; without library modifications. Arduino_GFX takes the offset as a parameter.
lib_deps =
    moononournation/GFX Library for Arduino @ ~1.3.9
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/mmMicky/TouchLib.git

; ── Compiler flags ───────────────────────────────────────────────────────────
; ── Pre-build patch ──────────────────────────────────────────────────────────
; Automatically fixes a bug in the installed Arduino_GFX library before
; every compilation (see scripts/patch_gfx.py for details).
extra_scripts = pre:scripts/patch_gfx.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DTOUCH_MODULES_CST_MUTUAL
